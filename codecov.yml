# Codecov configuration.
#
# Coverage is uploaded from two CI jobs and merged by flag:
#   * unit — `cargo llvm-cov --workspace --lib --bins` (every PR/push)
#   * e2e  — model-gated lib/bin + integration + CLI subprocess coverage
#            (main-push only; needs the ~225 MB INT8 model)
#
# Both uploads MUST pass `flags: unit` / `flags: e2e` in codecov-action so
# carryforward works. Without flags, a fresh main commit shows unit-only
# coverage (~75%) until Coverage (E2E) finishes (~20+ min later), and the
# badge dips even though real merged coverage is unchanged.
#
# Unit coverage (`--lib --bins`) is ~78% after the mock-engine layer
# (HTTP / WS / jobs / OpenAI / CLI helpers run without the INT8 model).
# Merged with the e2e flag (main-push) is the number on the badge.
# Remaining uncovered lines are dominated by fault-injection-only paths
# (ONNX-runtime internal failures, network model-download errors, forced
# panics / inference timeouts, OS-signal handlers) and `process::exit`
# / SIGINT arms that cannot return to the test harness.

codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        # No-regression gate: the merged coverage must not fall more than
        # `threshold` below the base commit. This locks in the achieved level
        # without pinning a brittle absolute number we then have to chase.
        target: auto
        threshold: 0.5%
        informational: false
    patch:
      default:
        # New / changed lines should be well covered. Mock-engine tests
        # make HTTP / WS / jobs / OpenAI paths unit-testable, so the
        # bar is the SOTA floor rather than a model-gated 80%.
        target: 90%
        threshold: 0%
        informational: false

flags:
  unit:
    carryforward: true
  e2e:
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  require_changes: false

ignore:
  - "**/tests/**"
  - "crates/gigastt-quantize/src/onnx_proto.rs" # prost-generated ONNX protobuf types
  # Native addons / bindgen stubs are exercised outside cargo llvm-cov
  # (npm vitest for node; uniffi-bindgen is a thin CLI wrapper). Counting
  # them in the Rust report permanently dilutes the badge without adding
  # signal about server/core quality.
  - "crates/gigastt-node/**"
  - "crates/gigastt-uniffi/src/bin/**"
