name: Homebrew Formula update

# Propose pins from published assets through the protected main branch PR path.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to pin Formula against (e.g. v2.22.0)'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  resolve-tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Execute only trusted default-branch code, never artifact contents.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Download current release attempt metadata
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: release-source-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/release-selection
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve and validate tag
        id: tag
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          METADATA_PATH: ${{ runner.temp }}/release-selection/release-source.json
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            python3 scripts/resolve-homebrew-release.py --tag "$MANUAL_TAG" --output "$GITHUB_OUTPUT"
          else
            python3 scripts/resolve-homebrew-release.py --metadata "$METADATA_PATH" \
              --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT"
          fi

  update-formula:
    needs: resolve-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Serialize automatic and manual proposals for the same validated tag.
    concurrency:
      group: homebrew-${{ needs.resolve-tag.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Fetch and validate published checksums
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern 'SHA256SUMS.txt' --dir "$RUNNER_TEMP/homebrew" --clobber
          python3 scripts/update-homebrew-formula.py "$TAG" "$RUNNER_TEMP/homebrew/SHA256SUMS.txt"
          git diff --check

      - name: Create or update formula pull request
        id: proposal
        # Pinned workflow-only dependency handles idempotent PR/branch updates.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ github.token }}
          branch: chore/homebrew-${{ needs.resolve-tag.outputs.tag }}
          base: main
          add-paths: Formula/gigastt.rb
          commit-message: 'chore(brew): pin formula to ${{ needs.resolve-tag.outputs.tag }}'
          title: 'chore(brew): pin formula to ${{ needs.resolve-tag.outputs.tag }}'
          body: |
            Update the formula from the published release SHA256SUMS.txt asset.
            Only Formula/gigastt.rb is included. Repeated runs update this same PR.

            A maintainer must approve workflows to run if GitHub displays that banner
            for this GITHUB_TOKEN-created PR, then review and merge after all checks pass.
            See docs/homebrew-release.md. This workflow never merges or pushes to main.

      - name: Explain required workflow approval
        if: steps.proposal.outputs.pull-request-number
        env:
          PR_URL: ${{ steps.proposal.outputs.pull-request-url }}
        run: |
          printf 'Formula PR: %s\n\nApprove workflows to run on the PR if prompted, then wait for all required checks before merging.\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
