name: Publication hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  public-content:
    runs-on: ubuntu-latest
    name: Public content
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test publication guard
        run: python3 -m unittest discover -s scripts -p test_check_publication.py
      - name: Check content and publication metadata
        run: python3 scripts/check-publication.py --event-file "$GITHUB_EVENT_PATH"
