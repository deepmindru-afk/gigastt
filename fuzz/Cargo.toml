[package]
name = "gigastt-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Empty `[workspace]` table: keeps this crate OUT of the parent gigastt
# workspace so `cargo build --workspace` (stable) never compiles the fuzz
# targets, which require a nightly toolchain and the libfuzzer sanitizer
# runtime. cargo-fuzz drives it directly via `cargo +nightly fuzz build`.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.gigastt-core]
path = "../crates/gigastt-core"
# `__internals` exposes the private tokenizer module + synthetic constructors
# so targets can exercise them without the INT8 model on disk. Disable
# default features (no diarization needed for fuzzing the pure-CPU paths).
default-features = false
features = ["__internals", "file-decode"]

# This package is its own workspace (`[workspace]` above) so it does NOT inherit
# the parent crate's `[patch.crates-io]`. Without these patches `audio_decode`
# links crates.io `symphonia-metadata` 0.6.0, whose APEv2 header path panics on
# `size + 32` overflow (nightly Continuous Fuzz crash-2cd57d8e…). Keep the
# vendor paths in lockstep with the root `Cargo.toml` patches; drop when
# upstream ships the fixes.
[patch.crates-io]
symphonia-metadata = { path = "../vendor/symphonia-metadata-0.6.0" }
symphonia-format-mkv = { path = "../vendor/symphonia-format-mkv-0.6.0" }

[[bin]]
name = "audio_decode"
path = "fuzz_targets/audio_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_parse"
path = "fuzz_targets/protocol_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pcm16_framing"
path = "fuzz_targets/pcm16_framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tokenizer"
path = "fuzz_targets/tokenizer.rs"
test = false
doc = false
bench = false
